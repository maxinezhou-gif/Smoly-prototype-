# Static site — nothing to build, the repo root is the site.
[build]
  publish = "."

# Markup, styles and script are never cached. A prototype gets edited far more
# often than it gets loaded, and a reviewer seeing a stale build and reporting
# bugs you already fixed costs more than the few KB this saves. Mirrors what
# serve.py does locally.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Cache-Control = "no-store"

# Images and fonts are content-stable and much heavier — let them cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
