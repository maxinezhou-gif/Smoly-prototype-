<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smoly — Prototypes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smoly">
<meta name="theme-color" content="#f2ede5">
<link rel="apple-touch-icon" href="assets/app-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    background: var(--md-sys-color-surface-container);
    font-family: var(--md-ref-typeface-plain), system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .index { width: 100%; max-width: 440px; }

  .index__list { display: flex; flex-direction: column; gap: var(--smoly-space-16); }

  .index__item {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 56px;
    padding-inline: var(--smoly-space-24);
    background: var(--md-sys-color-surface);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-full);
    color: var(--md-sys-color-on-surface);
    font: 600 17px/24px var(--md-ref-typeface-plain), system-ui, sans-serif;
    letter-spacing: .1px;
    text-align: center;
    text-decoration: none;
    transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .index__item:hover {
    background: var(--md-sys-color-surface-container-high);
    border-color: var(--md-sys-color-outline);
  }
  .index__item:active { transform: scale(.99); }

  .index__label {
    margin: var(--smoly-space-40) 0 var(--smoly-space-16);
    padding-inline: var(--smoly-space-24);
    color: var(--md-sys-color-outline);
    font: 400 15px/20px var(--md-ref-typeface-plain), system-ui, sans-serif;
  }

  /* archived entries stay reachable but recede */
  .index__item--archived {
    background: none;
    border-color: var(--md-sys-color-outline-variant);
    color: var(--md-sys-color-outline);
    font-weight: 400;
  }
  .index__item--archived:hover {
    background: var(--md-sys-color-surface-container-high);
    color: var(--md-sys-color-on-surface-variant);
  }

  @media (prefers-reduced-motion: reduce) {
    .index__item { transition: none; }
    .index__item:active { transform: none; }
  }

  /* Only worth saying on a phone, and pointless once they have done it */
  .index__tip { display: none; }
  @media (max-width: 440px) {
    body { padding: 32px 20px; }
    .index__tip {
      display: block;
      margin: var(--smoly-space-40) 0 0;
      padding-inline: var(--smoly-space-24);
      color: var(--md-sys-color-outline);
      font: 400 13px/18px var(--md-ref-typeface-plain), system-ui, sans-serif;
      text-align: center;
    }
  }
  @media (display-mode: standalone) {
    .index__tip { display: none; }
  }
</style>
</head>
<body>

<main class="index">

  <div class="index__list">
    <a class="index__item" href="smolify-book.html">Smolify a book</a>
    <a class="index__item" href="smolify-book-flat.html">Smolify a book — no dial halo</a>
  </div>

  <p class="index__label">Archived</p>

  <div class="index__list">
    <a class="index__item index__item--archived" href="archive/new-book-prototype/index.html">New book prototype</a>
  </div>

  <p class="index__tip">Share → Add to Home Screen to run these without the browser bar.</p>

</main>

</body>
</html>
